name: Create Wiki Article

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Article slug / ID (e.g., eclipse-gdps)'
        required: true
        type: string
      title:
        description: 'Article title (e.g., Eclipse)'
        required: true
        type: string
      infobox_type:
        description: 'Infobox template type (level, player, update, rules, default)'
        required: true
        default: 'level'
        type: choice
        options:
          - level
          - player
          - update
          - rules
          - default
      infobox_image:
        description: 'Infobox image URL or relative path (optional, e.g., https://.../image.png)'
        required: false
        default: ''
        type: string
      infobox_caption:
        description: 'Infobox image caption (optional)'
        required: false
        default: ''
        type: string
      summary:
        description: 'Introductory summary (HTML allowed)'
        required: true
        type: string
      section_heading:
        description: 'First section heading (e.g., Overview)'
        required: true
        default: 'Overview'
        type: string
      section_content:
        description: 'First section content (HTML allowed)'
        required: true
        type: string
      categories:
        description: 'Comma-separated categories (e.g., Levels, Demons)'
        required: false
        default: 'Maxr3 GDPS'
        type: string

jobs:
  create-article:
    runs-on: ubuntu-latest

    steps:
      - name: Downloading a Text Editor
        run: |
          echo "Downloading a Text Editor..."
          sleep 6

      - name: Moving Text Editor files
        run: |
          echo "Moving Text Editor files..."
          sleep 6

      - name: Opening program
        run: |
          echo "Opening program..."
          sleep 3

      - name: Providing file
        run: |
          echo "Providing file..."
          sleep 1

      - name: Creating file
        run: |
          echo "Creating file..."
          mkdir -p generated-article/data
          sleep 3

      - name: Filling in article data
        run: |
          echo "Filling in article data..."
          cat << 'EOF' > generate.py
          import json
          import os
          import re

          raw_id = os.environ["ARTICLE_ID"].strip().lower()
          slug = re.sub(r"[^a-z0-9-]+", "-", raw_id).strip("-") or "new-article"

          title = os.environ["ARTICLE_TITLE"].strip()
          infobox_type = os.environ["INFOBOX_TYPE"].strip()
          infobox_image = os.environ.get("INFOBOX_IMAGE", "").strip()
          infobox_caption = os.environ.get("INFOBOX_CAPTION", "").strip()
          summary = os.environ["ARTICLE_SUMMARY"].strip()
          heading = os.environ["SECTION_HEADING"].strip()
          content = os.environ["SECTION_CONTENT"].strip()
          categories = [
              c.strip() for c in os.environ.get("CATEGORIES", "").split(",") if c.strip()
          ]

          infobox = {
              "type": infobox_type,
              "title": title,
              "groups": [
                  {
                      "header": "Article Information",
                      "rows": [
                          {"label": "Article ID", "value": f"<code>{slug}</code>"},
                          {"label": "Type", "value": infobox_type.capitalize()}
                      ]
                  }
              ]
          }

          if infobox_image:
              infobox["image"] = infobox_image
          if infobox_caption:
              infobox["caption"] = infobox_caption

          article = {
              "id": slug,
              "title": title,
              "summary": summary,
              "infobox": infobox,
              "sections": [
                  {
                      "heading": heading,
                      "content": content
                  }
              ],
              "categories": categories
          }

          output_path = f"generated-article/data/{slug}.json"
          with open(output_path, "w", encoding="utf-8") as f:
              json.dump(article, f, indent=2, ensure_ascii=False)

          print(f"Wrote {output_path}")
          EOF

          ARTICLE_ID="${{ inputs.article_id }}" \
          ARTICLE_TITLE="${{ inputs.title }}" \
          INFOBOX_TYPE="${{ inputs.infobox_type }}" \
          INFOBOX_IMAGE="${{ inputs.infobox_image }}" \
          INFOBOX_CAPTION="${{ inputs.infobox_caption }}" \
          ARTICLE_SUMMARY="${{ inputs.summary }}" \
          SECTION_HEADING="${{ inputs.section_heading }}" \
          SECTION_CONTENT="${{ inputs.section_content }}" \
          CATEGORIES="${{ inputs.categories }}" \
          python3 generate.py

          sleep 16

      - name: Saving file
        run: |
          echo "Saving file..."
          sleep 3.5

      - name: Uploading to GitHub Actions
        run: |
          echo "Uploading to GitHub Actions..."
          sleep 2

      - name: Upload generated article artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-article-${{ inputs.article_id }}
          path: generated-article/
          retention-days: 7

      - name: Verify
        run: |
          echo "Verifying generated JSON file..."
          python3 -m json.tool generated-article/data/*.json > /dev/null
          ls -la generated-article/data/
          echo "Verification passed."

      - name: Ready
        run: |
          echo "Ready! Download the artifact from the workflow summary and upload the JSON file to your repository."

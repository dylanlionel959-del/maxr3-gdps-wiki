name: Wiki - Player Article

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Player slug / ID (e.g., maxr3)'
        required: true
        type: string
      title:
        description: 'Player name (e.g., Maxr3)'
        required: true
        type: string
      role:
        description: 'Role badge/text (e.g., Owner / Admin, Player, Moderator)'
        required: true
        default: 'Player'
        type: string
      country:
        description: 'Country (optional)'
        required: false
        default: ''
        type: string
      hardest:
        description: 'Hardest level (optional)'
        required: false
        default: ''
        type: string
      infobox_image:
        description: 'Infobox image URL or local path (optional)'
        required: false
        default: ''
        type: string
      infobox_caption:
        description: 'Infobox image caption (optional)'
        required: false
        default: ''
        type: string
      summary:
        description: 'Player summary (HTML allowed)'
        required: true
        type: string
      section_heading:
        description: 'Main section heading'
        required: true
        default: 'History'
        type: string
      section_content:
        description: 'Main section content (HTML allowed)'
        required: true
        type: string
      categories:
        description: 'Comma-separated categories'
        required: false
        default: 'Players, Maxr3 GDPS'
        type: string

permissions:
  contents: write

jobs:
  update-player-article:
    runs-on: ubuntu-latest

    steps:
      - name: Entering the Repository
        uses: actions/checkout@v4

      - name: Generate player JSON and update articles.json
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
          ARTICLE_TITLE: ${{ inputs.title }}
          PLAYER_ROLE: ${{ inputs.role }}
          PLAYER_COUNTRY: ${{ inputs.country }}
          PLAYER_HARDEST: ${{ inputs.hardest }}
          INFOBOX_IMAGE: ${{ inputs.infobox_image }}
          INFOBOX_CAPTION: ${{ inputs.infobox_caption }}
          ARTICLE_SUMMARY: ${{ inputs.summary }}
          SECTION_HEADING: ${{ inputs.section_heading }}
          SECTION_CONTENT: ${{ inputs.section_content }}
          CATEGORIES: ${{ inputs.categories }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re

          os.makedirs("data", exist_ok=True)
          slug = re.sub(r"[^a-z0-9-]+", "-", os.environ["ARTICLE_ID"].strip().lower()).strip("-")
          if not slug:
              raise SystemExit("Invalid article_id")

          title = os.environ["ARTICLE_TITLE"].strip()
          role = os.environ["PLAYER_ROLE"].strip() or "Player"
          country = os.environ.get("PLAYER_COUNTRY", "").strip()
          hardest = os.environ.get("PLAYER_HARDEST", "").strip()
          image = os.environ.get("INFOBOX_IMAGE", "").strip()
          caption = os.environ.get("INFOBOX_CAPTION", "").strip()
          summary = os.environ["ARTICLE_SUMMARY"].strip()
          heading = os.environ["SECTION_HEADING"].strip() or "History"
          content = os.environ["SECTION_CONTENT"].strip()
          categories = [c.strip() for c in os.environ.get("CATEGORIES", "").split(",") if c.strip()]

          rows = [
              {"label": "Role", "value": f"<b>{role}</b>"},
              {"label": "Article ID", "value": f"<code>{slug}</code>"}
          ]
          if country:
              rows.append({"label": "Country", "value": country})
          if hardest:
              rows.append({"label": "Hardest", "value": hardest})

          infobox = {
              "type": "player",
              "title": title,
              "groups": [{"header": "Player Information", "rows": rows}]
          }
          if image:
              infobox["image"] = image
          if caption:
              infobox["caption"] = caption

          article_data = {
              "id": slug,
              "title": title,
              "summary": summary,
              "infobox": infobox,
              "sections": [{"heading": heading, "content": content}],
              "categories": categories
          }

          with open(f"data/{slug}.json", "w", encoding="utf-8") as f:
              json.dump(article_data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          articles_path = "data/articles.json"
          ids = []
          if os.path.exists(articles_path):
              try:
                  with open(articles_path, "r", encoding="utf-8") as f:
                      loaded = json.load(f)
                      if isinstance(loaded, list):
                          ids = loaded
              except Exception:
                  ids = []
          if slug not in ids:
              ids.append(slug)

          with open(articles_path, "w", encoding="utf-8") as f:
              json.dump(ids, f, indent=2, ensure_ascii=False)
              f.write("\n")

          index_path = "data/index.json"
          if os.path.exists(index_path):
              try:
                  with open(index_path, "r", encoding="utf-8") as f:
                      index_obj = json.load(f)
              except Exception:
                  index_obj = {}
          else:
              index_obj = {}

          if not isinstance(index_obj, dict):
              index_obj = {}

          index_obj["wikiVersion"] = index_obj.get("wikiVersion") or "26.11"
          index_obj["lastUpdated"] = index_obj.get("lastUpdated") or "November 2026"
          index_obj["gdpsVersion"] = index_obj.get("gdpsVersion") or "2.208 / 2.2081"

          entries = index_obj.get("articles", [])
          if not isinstance(entries, list):
              entries = []

          plain_desc = re.sub(r"<[^>]+>", "", summary).strip()[:120]
          new_entry = {
              "id": slug,
              "title": title,
              "description": plain_desc or f"{title} ({role}) on Maxr3 GDPS"
          }
          replaced = False
          for i, item in enumerate(entries):
              if isinstance(item, dict) and item.get("id") == slug:
                  entries[i] = new_entry
                  replaced = True
                  break
          if not replaced:
              entries.append(new_entry)
          index_obj["articles"] = entries

          with open(index_path, "w", encoding="utf-8") as f:
              json.dump(index_obj, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "wiki(player): add/update ${{ inputs.article_id }}"
            git push
          fi

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Creator - Maxr3 GDPS Wiki</title>
    <style>
        :root {
          --bg-color: #f8f9fa;
          --text-color: #202122;
          --panel-bg: #ffffff;
          --border-color: #a2a9b1;
          --link-color: #0645ad;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --bg-color: #121212;
            --text-color: #eaecf0;
            --panel-bg: #1e1e1e;
            --border-color: #444950;
            --link-color: #6ea8ff;
          }
        }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; line-height: 1.5; }
        .admin-container { max-width: 800px; margin: 0 auto; background: var(--panel-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); }
        h1, h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; height: 100px; }
        .infobox-builder { background: rgba(0,0,0,0.03); padding: 15px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 20px; }
        .row-item { display: flex; gap: 10px; margin-bottom: 10px; }
        button { padding: 10px 20px; font-size: 1rem; font-weight: bold; background: var(--link-color); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: #d33; }
        pre { background: #1e1e1e; color: #dcdcdc; padding: 15px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Wiki Article Creator</h1>
        <p>Fill out the fields to automatically generate the exact JSON code.</p>

        <div class="form-group">
            <label>JSON file name (Ex: <code>maxr3-gdps.json</code>):</label>
            <input type="text" id="article-filename" value="article.json">
        </div>
        <div class="form-group">
            <label>Article Title:</label>
            <input type="text" id="article-title" placeholder="Ex: Maxr3 GDPS">
        </div>
        <div class="form-group">
            <label>Short Description (Subtitle):</label>
            <textarea id="article-desc" placeholder="Brief summary..."></textarea>
        </div>

        <div class="infobox-builder">
            <h2>Infobox Configuration</h2>
            <div class="form-group">
                <label>Image Status:</label>
                <select id="img-status" onchange="toggleImageInputs()">
                    <option value="off">Off (Disabled)</option>
                    <option value="on">On (Enabled)</option>
                </select>
            </div>
            <div id="image-details" style="display: none;">
                <div class="form-group">
                    <label>Image URL:</label>
                    <input type="text" id="img-url" placeholder="https://i.imgur.com/...png">
                </div>
                <div class="form-group">
                    <label>Image Caption:</label>
                    <input type="text" id="img-caption" placeholder="Ex: Official Logo">
                </div>
            </div>
            <h3>Data Rows</h3>
            <div id="infobox-rows-container"></div>
            <button type="button" onclick="addInfoboxRow()">+ Add Row</button>
        </div>

        <div class="form-group">
            <label>Main HTML Content:</label>
            <textarea id="article-content" placeholder="<p>Write here...</p>" style="height: 150px;"></textarea>
        </div>

        <button onclick="generateJSON()" style="width: 100%; font-size: 1.2rem; margin-bottom: 20px;">Generate JSON Code</button>

        <h2>Generated JSON Code</h2>
        <pre id="json-output">// Fill in the data and click generate</pre>
    </div>

    <script>
        function toggleImageInputs() {
            const status = document.getElementById('img-status').value;
            document.getElementById('image-details').style.display = status === 'on' ? 'block' : 'none';
        }
        function addInfoboxRow(label = '', value = '') {
            const container = document.getElementById('infobox-rows-container');
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row-item';
            rowDiv.innerHTML = `
                <input type="text" placeholder="Label" class="row-label" value="${label}" style="flex: 1;">
                <input type="text" placeholder="Value" class="row-value" value="${value}" style="flex: 1;">
                <button type="button" class="btn-danger" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(rowDiv);
        }
        function generateJSON() {
            const title = document.getElementById('article-title').value;
            const description = document.getElementById('article-desc').value;
            const content = document.getElementById('article-content').value;
            const imgStatus = document.getElementById('img-status').value;
            const imgUrl = document.getElementById('img-url').value;
            const imgCaption = document.getElementById('img-caption').value;
            const rowLabels = document.querySelectorAll('.row-label');
            const rowValues = document.querySelectorAll('.row-value');
            
            const dataRows = [];
            for (let i = 0; i < rowLabels.length; i++) {
                if(rowLabels[i].value.trim() !== '' && rowValues[i].value.trim() !== '') {
                    dataRows.push({ label: rowLabels[i].value, value: rowValues[i].value });
                }
            }

            const articleObj = {
                title, description,
                infobox: {
                    image: { status: imgStatus, url: imgStatus === 'on' ? imgUrl : "", caption: imgStatus === 'on' ? imgCaption : "" },
                    data: dataRows
                },
                content
            };
            document.getElementById('json-output').innerText = JSON.stringify(articleObj, null, 4);
        }
        addInfoboxRow("Owner", "MAXR3");
    </script>
</body>
</html>
